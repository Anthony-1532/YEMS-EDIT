<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YEMS Browser</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      -webkit-app-region: drag;
    }

    .nav-buttons {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .nav-buttons button {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: 8px;
      background: #2a2a2a;
      color: #999;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      transition: background 0.15s;
    }

    .nav-buttons button:hover { background: #3a3a3a; color: #fff; }
    .nav-buttons button:disabled { opacity: 0.3; cursor: default; }

    .url-bar {
      flex: 1;
      -webkit-app-region: no-drag;
    }

    .url-bar input {
      width: 100%;
      height: 34px;
      padding: 0 14px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #111;
      color: #e0e0e0;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .url-bar input:focus { border-color: #7b1d3c; }
    .url-bar input::placeholder { color: #555; }

    .content {
      flex: 1;
      background: #0f0f0f;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .content iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .home-screen {
      text-align: center;
      padding: 40px;
    }

    .home-screen h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #7b1d3c, #c94277);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .home-screen p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .home-screen .url-bar-home {
      max-width: 480px;
      margin: 0 auto;
    }

    .home-screen .url-bar-home input {
      width: 100%;
      height: 44px;
      padding: 0 18px;
      border: 1px solid #333;
      border-radius: 12px;
      background: #1a1a1a;
      color: #e0e0e0;
      font-size: 14px;
      outline: none;
    }

    .home-screen .url-bar-home input:focus { border-color: #7b1d3c; }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="nav-buttons">
      <button id="btn-back" disabled>&larr;</button>
      <button id="btn-forward" disabled>&rarr;</button>
      <button id="btn-refresh">&#8635;</button>
    </div>
    <div class="url-bar">
      <input type="text" id="url-input" placeholder="Search or enter URL..." autocomplete="off" spellcheck="false" />
    </div>
  </div>

  <div class="content" id="content">
    <div class="home-screen" id="home-screen">
      <h1>YEMS Browser</h1>
      <p>A minimal browser template</p>
      <div class="url-bar-home">
        <input type="text" id="home-url-input" placeholder="Enter a URL to get started..." autocomplete="off" spellcheck="false" />
      </div>
    </div>
  </div>

  <script>
    const urlInput = document.getElementById('url-input');
    const homeUrlInput = document.getElementById('home-url-input');
    const content = document.getElementById('content');
    const homeScreen = document.getElementById('home-screen');
    const btnBack = document.getElementById('btn-back');
    const btnForward = document.getElementById('btn-forward');
    const btnRefresh = document.getElementById('btn-refresh');

    let history = [];
    let historyIndex = -1;
    let currentIframe = null;

    function navigateTo(url) {
      const formatted = url.startsWith('http') ? url : `https://${url}`;

      // Remove home screen
      if (homeScreen) homeScreen.remove();

      // Create or reuse iframe
      if (!currentIframe) {
        currentIframe = document.createElement('iframe');
        currentIframe.sandbox = 'allow-same-origin allow-scripts allow-popups allow-forms';
        content.appendChild(currentIframe);
      }

      currentIframe.src = formatted;
      urlInput.value = formatted;

      // Update history
      history = history.slice(0, historyIndex + 1);
      history.push(formatted);
      historyIndex = history.length - 1;
      updateNavButtons();
    }

    function updateNavButtons() {
      btnBack.disabled = historyIndex <= 0;
      btnForward.disabled = historyIndex >= history.length - 1;
    }

    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = urlInput.value.trim();
        if (val) navigateTo(val);
      }
    });

    homeUrlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const val = homeUrlInput.value.trim();
        if (val) navigateTo(val);
      }
    });

    btnBack.addEventListener('click', () => {
      if (historyIndex > 0) {
        historyIndex--;
        const url = history[historyIndex];
        currentIframe.src = url;
        urlInput.value = url;
        updateNavButtons();
      }
    });

    btnForward.addEventListener('click', () => {
      if (historyIndex < history.length - 1) {
        historyIndex++;
        const url = history[historyIndex];
        currentIframe.src = url;
        urlInput.value = url;
        updateNavButtons();
      }
    });

    btnRefresh.addEventListener('click', () => {
      if (currentIframe) {
        currentIframe.src = currentIframe.src;
      }
    });

    // Focus URL bar on Ctrl+L
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'l') {
        e.preventDefault();
        urlInput.focus();
        urlInput.select();
      }
    });
  </script>
</body>
</html>
