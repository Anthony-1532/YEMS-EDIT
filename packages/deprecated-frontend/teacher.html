<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yeshua Educational Platform – Teacher Portal</title>
    <meta name="description" content="Yeshua Educational Platform – Teacher management and classroom portal." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800;0,14..32,900;1,14..32,400&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <!-- App Root -->
    <div id="app"></div>

    <!-- Toast Container -->
    <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/init.js"></script>
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/router.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/teacher.js"></script>
    <script>
        // Initialize data first
        if (typeof DataInit !== 'undefined') {
            DataInit.init();
        }
        
        // Teacher Portal - Check login or show login form
        function showLogin() {
            document.getElementById('app').innerHTML = `
            <div class="auth-wrap">
            <div class="auth-bg-blob"></div>
            <div class="auth-card glass">
                <div class="auth-logo">
                <div class="auth-logo-icon"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div>
                <div class="auth-logo-text">
                    <strong>Yeshua Educational Platform</strong>
                    <span>TEACHER PORTAL</span>
                </div>
                </div>
                <h1 class="auth-title">Teacher Access</h1>
                <p class="auth-sub">Sign in to your educator dashboard.</p>
                <form id="teacher-login-form">
                <div class="form-group">
                    <label class="form-label">Email Address</label>
                    <div class="input-wrap">
                    <span class="input-icon"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></span>
                    <input id="t-email" type="email" class="form-input" placeholder="teacher@yems.local" autocomplete="email" />
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="input-wrap">
                    <span class="input-icon"><svg class="icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg></span>
                    <input id="t-pass" type="password" class="form-input" placeholder="••••••••" autocomplete="current-password" />
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top:0.5rem;">
                    Sign In →
                </button>
                </form>
                <div class="auth-switch">
                <a href="index.html">← Back to Student Portal</a>
                </div>
                <div class="auth-demo-box">
                <p><svg class="icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg> Demo Credentials</p>
                <span><svg class="icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg> teacher@yems.local | <svg class="icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" fill="none" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> teacher</span>
                </div>
            </div>
            </div>
        `;

            document.getElementById('teacher-login-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                var email = document.getElementById('t-email').value.trim();
                var pass = document.getElementById('t-pass').value;
                var btn = e.target.querySelector('button[type="submit"]');
                
                btn.disabled = true; btn.textContent = 'Signing in…';

                try {
                    var res = await Auth.login(email, pass, false);
                    
                    if (res.ok && res.user && res.user.role === 'teacher') {
                        UI.toast('Welcome back, ' + res.user.name + '!', 'success');
                        // Initialize portal directly instead of reloading to avoid race condition
                        setTimeout(function() {
                            if (typeof initTeacherPortal === 'function') {
                                initTeacherPortal();
                            }
                        }, 300);
                    } else if (res.ok && res.user && res.user.role !== 'teacher') {
                        btn.disabled = false; btn.textContent = 'Sign In →';
                        UI.toast('Access denied. Teacher account required.', 'error');
                    } else {
                        btn.disabled = false; btn.textContent = 'Sign In →';
                        UI.toast(res.err || 'Invalid teacher credentials', 'error');
                    }
                } catch (err) {
                    btn.disabled = false; btn.textContent = 'Sign In →';
                    UI.toast(err.message || 'Login failed', 'error');
                }
            });
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', function() {
            try {
                var user = Auth.current();
                if (user && user.role === 'teacher') {
                    // User is authenticated teacher - initialize portal
                    if (typeof initTeacherPortal === 'function') {
                        initTeacherPortal();
                    }
                } else if (user && user.role !== 'teacher') {
                    // Logged in but not a teacher - redirect to appropriate portal
                    console.warn('[Teacher] Access denied for role:', user.role);
                    window.location.href = 'index.html';
                } else {
                    // Not logged in - show teacher login form
                    showLogin();
                }
            } catch (err) {
                console.error('Init error:', err);
                document.getElementById('app').innerHTML = '<div style="padding:2rem; text-align:center;"><h2>Error Loading</h2><p>' + err.message + '</p></div>';
            }
        });
    </script>
</body>

</html>
