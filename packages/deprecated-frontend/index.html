  <script>
    // Late initialization - ensure API uses YEMS_CONFIG after all scripts load
    (function() {
      if (window.YEMS_CONFIG && window.API && typeof API.configure === 'function') {
        API.configure({
          baseUrl: window.YEMS_CONFIG.API.baseUrl,
          timeout: window.YEMS_CONFIG.API.timeout,
          debug: window.YEMS_CONFIG.API.debug
        });
        console.log('[YEMS] API configured from YEMS_CONFIG');
      }
    })();
  </script>
